# ============================================
# ENDPOINTS DE ACCESO AL PROYECTO:
# ============================================

#   - AI Detection History: http://localhost:4200/ai-detection/history
#   - NASA APOD History: http://localhost:4200/nasa-apod/history
#   - Un endpoint de tipo acceso al proyecto, ejemplo: :4200/apis/ia

services:
  backend:
    image: luismencia/apis-ai-backend:latest
    container_name: apis-ai-backend
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    environment:
      # Database Configuration
      SPRING_R2DBC_URL: ${SPRING_R2DBC_URL}
      SPRING_R2DBC_USERNAME: ${SPRING_R2DBC_USERNAME}
      SPRING_R2DBC_PASSWORD: ${SPRING_R2DBC_PASSWORD}

      # Spring Configuration
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${BACKEND_PORT:-8080}

      # External API Keys
      RAPIDAPI_APIKEY: ${RAPIDAPI_APIKEY}
      NASA_APIKEY: ${NASA_APIKEY}
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: luismencia/apis-ai-demos-frontend:latest
    container_name: apis-ai-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      # APIURL se configura dinámicamente:
      # - LOCAL: usa localhost con el puerto del .env
      # - CODESPACES: cambiar BACKEND_HOST en .env a la URL pública del Codespace
      APIURL: http://${BACKEND_HOST:-localhost}:${BACKEND_PORT:-8080}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: apis-ai-network
