# Rutas principales del Frontend:
# - Historial AI Detection: http://localhost:${FRONTEND_PORT}/ai-detection/history
# - Historial NASA APOD: http://localhost:${FRONTEND_PORT}/nasa-apod/history
#
# Comandos útiles:
# - Levantar: docker-compose -f docker-compose-fe.yml up -d
# - Detener: docker-compose -f docker-compose-fe.yml down
#
# Configuración:
# - Editar el archivo .env para cambiar puertos y credenciales
# ============================================

services:
  backend:
    image: luismencia/apis-ai-demos:latest
    container_name: apis-ai-backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    command: java -jar /app/app.jar
    environment:
      SPRING_R2DBC_URL: ${SPRING_R2DBC_URL}
      SPRING_R2DBC_USERNAME: ${SPRING_R2DBC_USERNAME}
      SPRING_R2DBC_PASSWORD: ${SPRING_R2DBC_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${BACKEND_PORT}
      RAPIDAPI_APIKEY: ${RAPIDAPI_APIKEY}
      NASA_APIKEY: ${NASA_APIKEY}
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: luismencia/apis-ai-demos-frontend:buildcache
    container_name: apis-ai-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      APIURL: http://${BACKEND_HOST}:${BACKEND_PORT}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
